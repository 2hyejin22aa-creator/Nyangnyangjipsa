<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="color-scheme" content="light">
    <title>이혜진 | 기획</title>
    <meta name="description" content="브랜딩 · 연간 콘텐츠 계획">
    <link rel="stylesheet" href="../assets/site.css">
    <script src="../assets/pricing.js" defer></script>
    <script src="../assets/nav.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#main">본문으로 건너뛰기</a>

    <header class="tabbar">
        <div class="wrap tabbar-inner">
            <nav aria-label="사이트 메뉴">
                <ul class="tabs">
                    <li><a href="../">홈</a></li>
                    <li><a href="../services/">SNS 마케팅</a></li>
                    <li><a href="../video/">영상 편집</a></li>
                    <li><a href="../planning/" aria-current="page">기획</a></li>
                    <li data-tab="works" hidden><a href="../works/">작업물</a></li>
                </ul>
            </nav>
            <a class="btn btn-primary" href="https://open.kakao.com/o/sCHnO8pi" target="_blank" rel="noopener">카톡 상담</a>
        </div>
    </header>

    <main id="main">
        <p id="load-error" class="load-error" role="alert" hidden></p>

        <section class="hero" aria-labelledby="hero-title">
            <div class="wrap">
                <h1 id="hero-title">기획</h1>
            </div>
        </section>

        <section aria-labelledby="scope-title">
            <div class="wrap narrow">
                <h2 id="scope-title" class="visually-hidden">기획 범위</h2>
                <ol class="steps">
                    <li><strong>브랜딩 정리</strong><span>강점, 대상 고객, 말투와 분위기를 정리합니다</span></li>
                    <li><strong>연간·월별 콘텐츠 계획</strong><span>시즌과 일정에 맞춰 12개월 주제를 잡습니다</span></li>
                    <li><strong>주제 기획</strong><span>문의와 반응을 보고 반응이 좋을 주제를 고릅니다</span></li>
                    <li><strong>편집 방향</strong><span>주제마다 이미지·영상을 어떻게 만들지 정합니다</span></li>
                    <li><strong>정기 미팅</strong><span>업체 대표님과 만나 방향을 확인하고 조정합니다</span></li>
                </ol>
            </div>
        </section>

        <section aria-labelledby="price-title">
            <div class="wrap">
                <h2 id="price-title">가격</h2>
                <table class="price-table" data-pricing-table="setup" data-category="plan">
                    <thead><tr><th scope="col">항목</th><th scope="col">금액</th><th scope="col">내용</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <div class="wrap">
            <p>이혜진 · 1인 마케터 · 개인 프리랜서</p>
            <p id="last-updated" class="fine" hidden></p>
        </div>
    </footer>
</body>
</html>
