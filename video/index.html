<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="color-scheme" content="light">
    <title>이혜진 | 영상 편집</title>
    <meta name="description" content="릴스 · 클립 편집">
    <link rel="stylesheet" href="../assets/site.css">
    <script src="../assets/pricing.js" defer></script>
    <script src="../assets/nav.js" defer></script>
    <script src="../assets/media.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#main">본문으로 건너뛰기</a>

    <header class="tabbar">
        <div class="wrap tabbar-inner">
            <nav aria-label="사이트 메뉴">
                <ul class="tabs">
                    <li><a href="../">홈</a></li>
                    <li><a href="../services/">SNS 마케팅</a></li>
                    <li><a href="../video/" aria-current="page">영상 편집</a></li>
                    <li><a href="../planning/">기획</a></li>
                    <li data-tab="works" hidden><a href="../works/">작업물</a></li>
                </ul>
            </nav>
            <a class="btn btn-primary" href="https://open.kakao.com/o/sCHnO8pi" target="_blank" rel="noopener">카톡 상담</a>
        </div>
    </header>

    <main id="main">
        <p id="load-error" class="load-error" role="alert" hidden></p>

        <section class="hero" aria-labelledby="hero-title">
            <div class="wrap">
                <h1 id="hero-title">영상 편집</h1>
            </div>
        </section>

        <section data-slots hidden>
            <div class="wrap">
                <div data-slot="video/reels" hidden></div>
            </div>
        </section>

        <section aria-labelledby="process-title">
            <div class="wrap narrow">
                <h2 id="process-title">진행</h2>
                <ol class="steps">
                    <li><strong>소스 전달</strong></li>
                    <li><strong>편집(자막·BGM)</strong></li>
                    <li><strong>확인(수정 1회)</strong></li>
                    <li><strong>업로드</strong></li>
                </ol>
            </div>
        </section>

        <section aria-labelledby="criteria-title">
            <div class="wrap narrow">
                <h2 id="criteria-title">기준</h2>
                <ul class="criteria">
                    <li>15~30초</li>
                    <li>소스 5분 이내</li>
                    <li><span data-note="singles|릴스·클립 편집 (15~30초)"></span></li>
                </ul>
            </div>
        </section>

        <section aria-labelledby="price-title">
            <div class="wrap">
                <h2 id="price-title">가격</h2>
                <table class="price-table" data-pricing-table="singles,options" data-category="video">
                    <thead><tr><th scope="col">항목</th><th scope="col">금액</th><th scope="col">내용</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <div class="wrap">
            <p>이혜진 · 1인 마케터 · 개인 프리랜서</p>
            <p id="last-updated" class="fine" hidden></p>
        </div>
    </footer>
</body>
</html>
